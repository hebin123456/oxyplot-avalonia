# Fork（hebin123456/oxyplot-avalonia）的 NuGet 包发布流水线。
#
# 触发：push v* tag（发版）/ 手动 workflow_dispatch（仅构建验证，不发 release）。
# 产物：OxyPlot.Avalonia.<VersionPrefix>.nupkg（netstandard2.0，按 Avalonia 12.1.1 编译，
#       见 Source/Directory.Build.props），作为资产挂到 GitHub Release。
#       ForkPlus-Next 构建期通过
#       https://github.com/hebin123456/oxyplot-avalonia/releases/latest/download/<资产名>
#       拉取该 nupkg 到本地 NuGet 源（third_party/nuget/）消费——与 tokei / biturbo 同模式。
#
# 注意：升级 Avalonia 版本或同步上游后，改 Source/Directory.Build.props / csproj 的版本号，
#       提交后打对应 tag（如 v2.1.2-avalonia12.2）即可。tag 名与包版本保持一致（去掉 v 前缀）。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传资产

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-and-release:
    name: pack-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # dotnet pack 内部先 build 再产包：编译即验证（Avalonia 12.1.1 下能编过才会出包）
      - name: Build & pack
        run: >
          dotnet pack Source/OxyPlot.Avalonia/OxyPlot.Avalonia.csproj
          -c Release -o artifacts --nologo

      - name: Verify package
        shell: bash
        run: |
          nupkg=$(ls artifacts/*.nupkg 2>/dev/null | head -1)
          [ -n "$nupkg" ] || { echo "FAILED: no .nupkg produced"; exit 1; }
          size=$(wc -c < "$nupkg")
          [ "$size" -gt 10000 ] || { echo "FAILED: nupkg too small: ${size} bytes"; exit 1; }
          echo "package OK: $nupkg (${size} bytes)"

      # 仅 tag 触发时发 release（dispatch 只做上面的构建验证）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "publishing release for tag: $tag"
          # 重跑场景：release 已存在则补充/覆盖上传资产，否则新建（--verify-tag 防止打错 tag）
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" artifacts/*.nupkg --clobber
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              artifacts/*.nupkg \
              --title "OxyPlot.Avalonia $tag" \
              --verify-tag \
              --notes "Fork build of [oxyplot/oxyplot-avalonia](https://github.com/oxyplot/oxyplot-avalonia), compiled against **Avalonia 12.1.1** (upstream stays on Avalonia 11).

          **Asset**: \`OxyPlot.Avalonia.2.1.2-avalonia12.1.nupkg\` (netstandard2.0, depends on OxyPlot.Core 2.1.2 from nuget.org)

          ForkPlus-Next consumes this via build-time download into a local NuGet source (same pattern as tokei / biturbo):
          \`https://github.com/hebin123456/oxyplot-avalonia/releases/latest/download/OxyPlot.Avalonia.2.1.2-avalonia12.1.nupkg\`
          Package version uses the \`-avalonia12.x\` suffix so it can never be confused with the official nuget.org \`OxyPlot.Avalonia\` 2.1.2 (Avalonia 11)."
          fi
          echo "--- release assets ---"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
